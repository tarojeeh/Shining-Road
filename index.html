<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shining Road</title>
<meta name="theme-color" content="#62c6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shining Road">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap&subset=vietnamese" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
:root{
  --sky1:#62c6f0; --sky2:#bdeeff; --grass:#86cf5c; --grass2:#74bd4c; --path:#f6e7b8;
  --ink:#2d1b4e; --paper:#fffaf0; --gold:#f7c531; --gold2:#e39a1c; --grey:#b9b3c9; --pink:#ff8fb1;
  --green:#5cc95a; --green2:#3a9a3c; --red:#ff5d6c; --night:#3b2a63; --night2:#2a1d4a;
  --shadow:#2d1b4e55; --text:#2d1b4e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#1e2a6b;--sky2:#3f4fa8;--grass:#3f7a3a;--grass2:#356a31;--path:#c9b98a;--paper:#f3ecdc}}
:root[data-theme="dark"]{--sky1:#1e2a6b;--sky2:#3f4fa8;--grass:#3f7a3a;--grass2:#356a31;--path:#c9b98a;--paper:#f3ecdc}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--sky1);font-family:"VT323","Courier New",monospace;color:var(--text);overflow:hidden}
img,svg.px{image-rendering:pixelated;max-width:100%}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:440px;margin:0 auto;position:relative;background:var(--sky1);overflow:hidden}
.hud{display:flex;gap:6px;padding:10px 10px 6px;justify-content:flex-end;align-items:center;position:relative;z-index:3}
.chip{display:flex;align-items:center;gap:4px;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:0 8px 0 4px;font-size:22px;line-height:28px}
.chip img{width:22px;height:22px;object-fit:contain}
.me{padding:0 4px;cursor:pointer;margin-right:auto}
.me img{width:26px;height:26px}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.qv.on{display:block}
.title{margin:0;text-align:center;font-weight:400;color:var(--gold);letter-spacing:1px;line-height:.9;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 var(--shadow)}
/* map view */
#vMap{background:linear-gradient(var(--sky1) 0 20%,var(--sky2) 20% 30%,var(--grass) 30%)}
.mhead{text-align:center;padding:0 0 6px}
.mhead .hi{font-size:22px;color:var(--paper);text-shadow:2px 2px 0 var(--ink)}
.mhead .title{font-size:52px}
.map{flex:1;overflow-y:auto;background-color:var(--grass);
  background-image:radial-gradient(var(--grass2) 2px,transparent 2.5px),radial-gradient(#fff 1.5px,transparent 2px);
  background-size:28px 28px,90px 90px;background-position:0 0,40px 30px;border-top:4px solid var(--ink)}
.board{position:relative;width:360px;height:720px;margin:0 auto}
.board > svg{position:absolute;inset:0}
.node{position:absolute;width:96px;height:96px;transform:translate(-50%,-50%);border:none;padding:0;background:none;cursor:pointer;color:var(--ink)}
.face{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);
  clip-path:polygon(16% 0,84% 0,84% 6%,94% 6%,94% 16%,100% 16%,100% 84%,94% 84%,94% 94%,84% 94%,84% 100%,16% 100%,16% 94%,6% 94%,6% 84%,0 84%,0 16%,6% 16%,6% 6%,16% 6%);
  box-shadow:inset 0 0 0 5px var(--ink),inset -6px -6px 0 5px #0001}
.node .d{font-size:52px;line-height:.8}.node .m{font-size:22px;line-height:1}
.node.shine .face{background:var(--gold);box-shadow:inset 0 0 0 5px var(--ink),inset -8px -8px 0 5px var(--gold2)}
.node.today::after{content:"Hôm nay";position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--pink);color:var(--paper);border:3px solid var(--ink);font-size:18px;padding:0 6px;white-space:nowrap}
.node.today .face{animation:bob 1.2s steps(2) infinite}
.node.lock .face{background:var(--grey);color:#5d5675}
.spark{position:absolute;width:22px;animation:tw 1.6s steps(2) infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.info{position:absolute;display:flex;flex-direction:column;gap:8px;width:160px}
.row{display:flex;align-items:center;gap:6px;font-size:20px}.row.rev{flex-direction:row-reverse}
.av{width:30px;height:28px;object-fit:contain}
.bar{flex:1;height:14px;border:3px solid var(--ink);background:var(--paper);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,var(--gold2) 6px 8px);transition:width .4s steps(4)}
.row b{font-weight:400;min-width:30px;text-align:center;background:var(--paper);border:2px solid var(--ink);line-height:18px}
/* quest views */
.qv{overflow-y:auto;padding:4px 12px 24px;background:var(--path);
  background-image:linear-gradient(90deg,#0000 0 calc(100% - 2px),#2d1b4e10 0),linear-gradient(#0000 0 calc(100% - 2px),#2d1b4e10 0);background-size:16px 16px;border-top:4px solid var(--ink)}
.qtop{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.qtop .title{font-size:44px;text-align:left;flex:1}
.back{background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);font-size:24px;padding:0 10px;cursor:pointer}
.datechip{background:var(--ink);color:var(--paper);font-size:20px;padding:2px 8px}
.mecard{display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px 10px;margin-bottom:14px}
.mecard .av{width:48px;height:44px}
.mecard .nm{font-size:26px;line-height:1}
.mecard .earn{font-size:19px;opacity:.8}
.mecard .grow{flex:1;display:flex;flex-direction:column;gap:4px}
.mecard .bar{flex:none}
.sec{font-size:26px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,#0000 8px 14px)}
/* boss card */
.boss{position:relative;background:linear-gradient(var(--night) 0 70%,var(--night2) 70%);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--shadow);color:var(--paper);padding:10px 12px 12px;margin-bottom:12px;overflow:hidden}
.boss::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,#0000 1.5px);background-size:22px 22px;opacity:.5;pointer-events:none}
.boss .bt{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.boss .bn{font-size:30px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.boss .bsub{font-size:20px;opacity:.9}
.due{background:var(--red);color:var(--paper);border:2px solid var(--ink);font-size:17px;padding:0 6px;white-space:nowrap}
.arena{display:flex;align-items:flex-end;gap:12px;margin:6px 0 8px;position:relative}
.mon{width:96px;height:96px;flex:none;animation:bob 1s steps(2) infinite;transform-origin:bottom}
.mon.hit{animation:hit .35s steps(3)}
.mon.dead{animation:none;filter:grayscale(1) brightness(.8);transform:scaleY(.45) scaleX(1.15)}
@keyframes hit{0%{transform:translateX(0)}33%{transform:translateX(-8px);filter:brightness(3)}66%{transform:translateX(8px)}100%{transform:translateX(0)}}
.hpw{flex:1}
.hpl{font-size:18px;display:flex;justify-content:space-between}
.hp{height:18px;border:3px solid var(--ink);background:#1a1030;position:relative;box-shadow:0 0 0 2px var(--paper)}
.hp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 8px,#d63a4b 8px 10px);transition:width .5s steps(5)}
.dmg{position:absolute;left:30px;top:0;font-size:30px;color:var(--gold);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:up .7s steps(4) forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.steps{display:flex;flex-direction:column;gap:6px;position:relative;margin-bottom:8px}
.stp{display:flex;align-items:center;gap:8px;background:#ffffff18;border:2px solid #fff4;padding:4px 8px;font-size:20px;cursor:pointer;text-align:left;color:var(--paper)}
.stp .sw{width:22px;height:22px;flex:none}
.stp.done{opacity:.55;text-decoration:line-through;cursor:default}
.defeated{font-size:34px;color:var(--gold);text-shadow:2px 2px 0 var(--ink);text-align:center;letter-spacing:2px}
/* quest card */
.q{display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px;margin-bottom:10px;position:relative}
.ico{width:52px;height:52px;flex:none;border:3px solid var(--ink);display:grid;place-items:center;padding:6px}
.ico svg{width:100%;height:100%}
.qb{flex:1;min-width:0}
.qn{font-size:24px;line-height:1}
.qm{font-size:18px;opacity:.75}
.rws{display:flex;gap:8px;margin-top:2px}
.rw{display:flex;align-items:center;gap:2px;font-size:19px}
.rw img{width:16px;height:16px;object-fit:contain}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);font-size:22px;padding:2px 10px;cursor:pointer;background:var(--gold);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.claim{background:var(--green);color:var(--paper);text-shadow:2px 2px 0 var(--green2);animation:pulse .8s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.btn.big{font-size:28px;padding:4px 14px}
.sos{font-size:16px;background:var(--paper);border:2px solid var(--ink);padding:0 6px;cursor:pointer;color:var(--ink)}
.boss .sos{background:#ffffff22;color:var(--paper);border-color:#fff6}
.q.claimed{background:#e9f7d8;box-shadow:2px 2px 0 var(--shadow)}
.q.claimed .qn{text-decoration:line-through;opacity:.6}
.check{width:34px;height:34px;flex:none}
.q.lock{opacity:.7;background:#ece8f4}
.q.wait .qm{color:#b0457a;opacity:1}
.ask{background:var(--ink);color:var(--paper);padding:8px 10px;margin:-6px 0 12px;font-size:20px;border:4px solid var(--ink)}
.ask .row2{display:flex;gap:8px;margin-top:6px}
.ask .btn{font-size:20px}
.ask .no{background:var(--paper)}
details.other{background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);margin-top:16px}
details.other summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:24px;cursor:pointer}
details.other summary::-webkit-details-marker{display:none}
details.other summary .tg{margin-left:auto;font-size:20px}
details.other[open] summary .tg{transform:rotate(90deg)}
.mini{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:20px;border-top:2px dotted var(--ink)}
.mini > svg{width:22px;height:22px;flex:none}
.mini.ok span{text-decoration:line-through;opacity:.6}
.mini em{font-style:normal;margin-left:auto}
.fly{position:fixed;width:22px;height:22px;z-index:50;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.4,.7,1),opacity .7s}
/* nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--path);border-top:4px solid var(--ink);position:relative;z-index:3}
nav button{font-size:17px;line-height:1.1;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:6px 2px;cursor:pointer}
nav button[aria-current]{background:var(--gold);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:20px;padding:4px 10px;display:none;z-index:40;white-space:nowrap}
/* onboarding */
.onb{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:18px 16px 20px;background:linear-gradient(var(--sky1) 0 55%,var(--sky2) 55% 68%,var(--grass) 68%);overflow-y:auto}
.onb[hidden]{display:none}
.onb .title{font-size:60px;line-height:.85;margin-top:10px}
.step{display:none;flex:1;flex-direction:column;align-items:center;width:100%;max-width:360px}.step.on{display:flex}
.say{font-size:30px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);margin:14px 0 12px;text-align:center;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{position:relative;min-width:0;aspect-ratio:1;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);cursor:pointer}
.tile img{position:absolute;left:12%;top:12%;width:76%;height:76%;object-fit:contain}
.tile[aria-pressed="true"]{background:var(--gold);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.tile[aria-pressed="true"] img{animation:bob 1s steps(2) infinite}
.bigb{margin-top:auto;width:100%;font-size:30px;background:var(--pink);color:var(--paper);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--shadow);padding:8px;cursor:pointer;text-shadow:2px 2px 0 var(--ink)}
.bigb:disabled{background:var(--grey);text-shadow:none;color:#6e6886;cursor:not-allowed}
.hero{width:150px;height:150px;background:var(--paper);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--shadow);display:grid;place-items:center;padding:16px;margin-top:40px}
.hero img{width:100%;height:100%;object-fit:contain;animation:bob 1s steps(2) infinite}
.field{width:100%;font-family:inherit;font-size:28px;text-align:center;background:var(--paper);border:4px solid var(--ink);padding:6px;color:var(--ink)}
.code{font-size:44px;letter-spacing:6px;background:var(--paper);border:4px dashed var(--ink);padding:0 14px;margin:6px 0}
.hint{font-size:20px;text-align:center;background:#fffaf0cc;padding:2px 8px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cur{cursor:pointer}
.scrim{position:absolute;inset:0;background:#2d1b4e88;z-index:20;display:none}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:70%;overflow-y:auto;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);padding:12px 14px 16px;z-index:21;display:none}
.sheetOn .scrim,.sheetOn .sheet{display:block}
.sheet h2{margin:0 0 10px;font-weight:400;font-size:32px;line-height:1;display:flex;align-items:center;gap:8px}
.sheet h2 img{width:30px;height:30px;object-fit:contain}
.sheet .close{margin-left:auto;font-size:22px;background:var(--pink);color:var(--paper);border:3px solid var(--ink);cursor:pointer;padding:0 8px}
.src{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:6px 8px;margin-bottom:8px;cursor:pointer;font-size:21px}
.src .si{width:34px;height:34px;flex:none}
.src .sn{flex:1;line-height:1.05}
.src .sn small{display:block;font-size:17px;opacity:.7}
.src .amt{display:flex;align-items:center;gap:2px;font-size:22px}
.src .amt img{width:18px;height:18px;object-fit:contain}
.empty{text-align:center;padding:8px 0 4px}
.empty .zz{position:relative;width:110px;height:110px;margin:0 auto}
.empty .zz svg{width:100%;height:100%;animation:breathe 2s steps(2) infinite;transform-origin:bottom}
.empty .z{position:absolute;right:-6px;top:0;font-size:26px;animation:zz 2s steps(4) infinite}
.empty .z:nth-child(3){animation-delay:1s;right:-22px;font-size:20px}
@keyframes breathe{50%{transform:scaleY(.93) scaleX(1.04)}}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
.empty p{margin:6px 0 0;font-size:24px;line-height:1}
.empty small{display:block;font-size:19px;opacity:.7;margin-top:4px}
.flash{animation:fl .9s steps(3)}
.boss.wk{background:linear-gradient(#8c1f36 0 70%,#66152a 70%)}
.boss.mo{background:linear-gradient(#155a63 0 70%,#0e434a 70%)}
.tmr{display:flex;align-items:center;justify-content:center;gap:4px;font-size:23px;background:var(--gold);border:3px solid var(--ink);padding:2px 8px;margin:10px 0 8px}
.tmr b{font-weight:400}
.tmr img{width:20px;height:20px;object-fit:contain}
.src.fut{cursor:default;background:#ece8f4;box-shadow:none;border-style:dashed}
.empty small{display:block}
@keyframes fl{50%{box-shadow:0 0 0 5px var(--gold),4px 4px 0 var(--shadow)}}

.cal{background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px}
.calh{text-align:center;font-size:26px;margin-bottom:6px}
.wd,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd span{text-align:center;font-size:18px;opacity:.7}
.cell{min-height:54px;border:2px solid var(--ink);background:#fff;padding:2px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:20px;line-height:1}
.cell.past{opacity:.5}.cell.tdy{background:var(--gold)}.cell.sel{outline:3px solid var(--pink);outline-offset:1px}
.cell .cnt{display:flex;gap:1px;margin-top:2px;font-size:15px;align-items:center}
.cell .cnt img{width:13px;height:13px;object-fit:contain}
.cell.blank{visibility:hidden}
.dayp{margin-top:14px}
.who2{display:flex;align-items:center;gap:6px;font-size:22px;padding:6px 10px 2px}
.daybox{background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding-bottom:6px;margin-bottom:10px}
.empty2{padding:4px 10px;font-size:19px;opacity:.6}
.mini .del{margin-left:6px;font-size:16px;background:var(--paper);border:2px solid var(--ink);cursor:pointer;padding:0 4px}
.tag{font-size:15px;background:var(--pink);color:var(--paper);padding:0 4px;margin-left:4px}
.addb{width:100%;font-size:26px;margin-top:4px}
.note{font-size:19px;opacity:.7;text-align:center;margin-top:6px}
.form label{display:block;font-size:20px;margin:10px 0 4px}
.form select,.form input{width:100%;font-family:inherit;font-size:22px;border:3px solid var(--ink);background:#fff;padding:2px 6px;color:var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:3px solid var(--ink);background:#fff;padding:2px 8px;font-size:20px;cursor:pointer;display:flex;align-items:center;gap:4px}
.opt[aria-pressed="true"]{background:var(--gold)}
.opt img{width:22px;height:22px;object-fit:contain}.opt svg{width:22px;height:22px}
.opt small{font-size:16px;opacity:.75}
.node.miss .face{background:#ddd6e8;color:#6e6886}
.camp{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:4px;cursor:pointer;z-index:2}
.camp svg{width:100%;height:100%}
.camp.off{background:#ece8f4}
.mkt{position:absolute;width:150px;transform:translate(-50%,-50%);background:none;border:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.mkt .st{width:84px;height:72px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:6px}
.mkt .st svg{width:100%;height:100%}
.mkt .lb{margin-top:6px;background:var(--red);color:var(--paper);border:3px solid var(--ink);font-size:18px;padding:0 6px;white-space:nowrap}
.mkt .warn{background:var(--gold);color:var(--ink);border:2px solid var(--ink);font-size:15px;padding:0 4px;margin-top:2px}
.mile{position:absolute;left:50%;transform:translateX(-50%);background:var(--paper);border:3px dashed var(--ink);font-size:20px;padding:2px 10px;white-space:nowrap}
.home{position:absolute;right:12px;bottom:12px;z-index:4;display:none}
.home.on{display:block}
.mapwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
/* cook */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.slot{background:var(--paper);border:4px dashed var(--ink);min-height:84px;padding:6px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:22px;line-height:1.05}
.slot small{font-size:17px;opacity:.7;display:block}
.slot.fill{border-style:solid;background:#fff6d6}
.dishes{display:flex;flex-direction:column;gap:6px}
.dish{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:4px 8px;font-size:21px;cursor:pointer}
.dish[aria-pressed="true"]{background:var(--gold)}
.dish .dn{flex:1}
.dish .ds{font-size:16px;opacity:.8;text-align:right;line-height:1.1}
.txt{width:100%;font-family:inherit;font-size:20px;border:3px solid var(--ink);background:#fff;padding:4px 6px;color:var(--ink)}
.cookhero{display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px 10px;margin-bottom:12px}
.cookhero .fire{width:56px;height:56px;flex:none}
.cookhero .av{width:40px;height:38px}
.cookhero .ct{flex:1;font-size:22px;line-height:1.05}
.cookhero .ct small{display:block;font-size:17px;opacity:.75}
.viewonly{background:var(--paper);border:4px solid var(--ink);padding:10px;font-size:22px;text-align:center}
.viewonly b{display:block;font-weight:400;font-size:30px;margin:4px 0}
/* market */
.mrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);padding:4px 8px;margin-bottom:6px;font-size:20px;cursor:pointer}
.mrow .dd{width:48px;flex:none;line-height:1}
.mrow .dd small{display:block;font-size:15px;opacity:.7}
.mrow .av{width:26px;height:24px}
.mrow .mm{flex:1;line-height:1.05}
.mrow.no .mm{color:#b0457a}
.ing{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);padding:4px 8px;margin-bottom:6px;font-size:21px;cursor:pointer}
.ing .bx{width:22px;height:22px;border:3px solid var(--ink);flex:none;display:grid;place-items:center}
.ing .bx svg{width:16px;height:16px}
.ing .iq{margin-left:auto;font-size:17px;opacity:.7;display:inline}
.ing.got .nm{text-decoration:line-through;opacity:.55}
/* shop & bag */
.rot{font-size:19px;text-align:center;background:var(--ink);color:var(--paper);padding:2px 8px;margin-bottom:10px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard .eg{width:70px;height:70px}
.mcard .eg svg{width:100%;height:100%}
.mcard .mn{font-size:22px;line-height:1}
.mcard .mi{font-size:16px;opacity:.7}
.rar{font-size:15px;border:2px solid var(--ink);padding:0 4px}
.rar.c{background:#e8e2f2}.rar.u{background:#bfe6ff}.rar.r{background:var(--gold)}
.price{display:flex;align-items:center;gap:3px;font-size:19px;justify-content:center}
.price img{width:16px;height:16px;object-fit:contain}
.mcard .btn{width:100%;font-size:20px}
.btn:disabled{background:var(--grey);color:#6e6886;cursor:not-allowed;animation:none}
.own{font-size:18px;background:#e9f7d8;border:2px solid var(--ink);padding:0 6px}
.dexbar{background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px 10px;margin-bottom:12px;font-size:21px}
.dexbar .bar{margin-top:4px;flex:none}
.pnote{font-size:17px;opacity:.7;text-align:center;margin-top:12px}

.mcard .eg .spr{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.mcard .eg .egf{display:block;width:100%;height:100%}
.mcard .eg .egf[hidden]{display:none}

.rar.L{background:var(--pink);color:var(--paper)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dcell{background:#fff;border:2px solid var(--ink);padding:4px 2px;text-align:center;font-size:15px;line-height:1.05;display:flex;flex-direction:column;align-items:center;min-width:0}
.dcell span:not(.eg){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dcell small{opacity:.6;font-size:13px}
.dcell .eg{width:48px;height:48px}
.dcell .eg .spr{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.dcell:not(.got) .spr{filter:brightness(0);opacity:.25}
.dcell:not(.got) .egf{filter:grayscale(1);opacity:.35}
.dcell.got{background:#fff6d6}
.opts .opt{flex:none}

.mbtn{cursor:pointer;border:none;font-family:inherit}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mgrid .opt{justify-content:center}
.mgrid .opt.now{border-style:dashed}
.or{font-size:22px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);margin:12px 0 8px}
.bigb.alt2{background:var(--paper);color:var(--ink);text-shadow:none}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.05;min-width:0}
.bdg .md{width:42px;height:50px}.bdg .md svg{width:100%;height:100%}
.bdg .bn2{font-size:18px}
.bdg .bt2{font-size:15px;background:var(--ink);color:var(--paper);padding:0 4px}
.bdg small{font-size:14px;opacity:.75}
.bdg .bar{width:100%;height:10px;flex:none;border-width:2px;margin-top:2px}
.bdg.off{background:#ece8f4}.bdg.off .bn2{opacity:.7}

.toast{white-space:normal;max-width:90%;text-align:center}

.bdg .bcl{font-size:15px;padding:1px 4px;margin-top:4px;display:flex;align-items:center;gap:1px;flex-wrap:wrap;justify-content:center}
.bdg img,.rewtable img{width:12px;height:12px;object-fit:contain;vertical-align:middle}
.nrw{font-size:13px;opacity:.7;margin-top:3px}
.rewtable{font-size:16px;text-align:center;background:var(--paper);border:2px dashed var(--ink);padding:3px 6px;margin-bottom:8px;line-height:1.3}
nav button{position:relative}
nav button.dot::after{content:"";position:absolute;top:-5px;right:-3px;width:12px;height:12px;background:var(--red);border:2px solid var(--ink)}

svg.av{width:30px;height:28px;overflow:visible}
.me svg.av{width:28px;height:26px}
.mecard svg.av{width:48px;height:44px}
.cookhero svg.av{width:40px;height:38px}
.mrow svg.av{width:26px;height:24px}
.tryon{width:84px;height:80px;display:grid;place-items:center}
.tryon > svg{width:100%;height:100%}
.mcard.on{background:#fff6d6;outline:3px solid var(--gold)}
.lockx{font-size:15px;opacity:.75;line-height:1.1}
.dressroom{display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:10px;margin-bottom:10px}
.dressroom svg.big{width:120px;height:120px;flex:none;animation:bob 1.2s steps(2) infinite}
.slotsw{flex:1;display:flex;flex-direction:column;gap:8px}
.sw{font-size:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:2px dotted var(--ink);padding-bottom:4px}
.sw b{font-weight:400;background:var(--ink);color:var(--paper);padding:0 6px}

/* ---------- phạt & bounty ---------- */
.bounty{display:flex;gap:10px;align-items:center;background:#fff6d6;border:4px dashed var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px;margin-bottom:10px}
.bounty .si2{width:44px;height:44px;flex:none}.bounty .si2 svg{width:100%;height:100%}
.bounty .sb2{flex:1;font-size:21px;line-height:1.1}.bounty small{display:block;font-size:17px;opacity:.8}
.bounty small b{font-weight:400;background:var(--ink);color:var(--paper);padding:0 4px}
.qm.miss{color:var(--red);opacity:1}
.debt{font-size:13px;color:var(--red);margin-left:3px}

/* ---------- iPad / màn hình lớn ---------- */
@media (min-width:768px){
  .app{max-width:none;display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto 1fr}
  .hud{grid-column:2;grid-row:1;padding:12px 18px 8px}
  .views{grid-column:2;grid-row:2}
  nav{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px));border-top:none;border-right:4px solid var(--ink)}
  nav button{font-size:20px;padding:14px 4px;white-space:nowrap}
  nav button.dot::after{top:-6px;right:-6px}
  .chip{font-size:26px;line-height:34px}.chip img{width:26px;height:26px}
  .me svg.av{width:34px;height:32px}
  .mhead .title{font-size:72px}.mhead .hi{font-size:26px}
  .board{zoom:1.35}
  .qv{padding:8px 28px 40px}
  .qv>*{max-width:820px;margin-left:auto;margin-right:auto}
  .qtop .title{font-size:56px}
  .sgrid{grid-template-columns:repeat(3,1fr);gap:14px}
  .bgrid{grid-template-columns:repeat(5,1fr)}
  .dgrid{grid-template-columns:repeat(7,1fr)}
  .cell{min-height:76px;font-size:24px}
  .cell .cnt img{width:16px;height:16px}
  .slots .slot{min-height:110px;font-size:26px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(600px,92%);max-height:84%}
  .onb .step{max-width:480px}
  .toast{bottom:40px;font-size:24px}
  .home{right:24px;bottom:24px}
  .dressroom svg.big{width:180px;height:180px}
  .tryon{width:110px;height:104px}
}
@media (min-width:1100px){
  .sgrid{grid-template-columns:repeat(4,1fr)}
  .qv>*{max-width:1000px}
  .board{zoom:1.25}
}
@media (min-width:768px) and (orientation:landscape){
  .mhead .title{font-size:56px}.mhead{padding-bottom:4px}
}

.sosin{display:flex;gap:10px;background:#fff0f5;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:8px;margin-bottom:10px}
.sosin .si2{width:44px;height:44px;flex:none}.sosin .si2 svg{width:100%;height:100%}
.sosin .sb2{flex:1;font-size:21px;line-height:1.1}.sosin .sb2 b{font-weight:400;background:var(--pink);color:var(--paper);padding:0 4px}
.sosin small{display:block;font-size:17px;opacity:.75;margin-top:2px}
.sosin .row2{display:flex;gap:8px;margin-top:6px}.sosin .no{background:var(--paper)}
</style>
</head>

<script>
/* Shining Road — lịch chia việc dùng chung cho app và Cloud Functions.
   Cùng input (ngày, số người) luôn ra cùng kết quả trên mọi máy. */
(function(root){
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(g,h,e)=>({g,h:h||0,e:e||0});
const EPOCH=Date.UTC(2024,0,1); // một ngày thứ Hai
function dayNum(key){const[y,m,d]=key.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)}
const DAILY_REST=[{t:"Quét nhà",i:"broom",r:R(15)},{t:"Vứt rác & thay túi",i:"trash",r:R(5)},{t:"Xếp bát đĩa lên kệ",i:"plates",r:R(5)}];
function genDay(key,N){N=Math.max(1,N);const rnd=rng(+key.replace(/-/g,''));
  const cook=Math.floor(rnd()*N),laundry=Math.floor(rnd()*N),wash=N>1?(cook+1+Math.floor(rnd()*(N-1)))%N:0;
  const q=Array.from({length:N},()=>[]),load=Array(N).fill(0);
  const add=(p,o)=>{o.id=key+'-'+o.t;q[p].push(o);load[p]+=o.r.g};
  add(cook,{t:"Nấu bữa tối",i:"pot",cook:true,r:R(15)});
  add(wash,{t:"Rửa bát & dọn bếp",i:"dish",r:R(25)});
  add(laundry,{t:"Giặt quần áo",i:"shirt",r:R(10)});add(laundry,{t:"Phơi quần áo",i:"hanger",r:R(10)});
  const rest=DAILY_REST.map(o=>({...o,r:{...o.r}}));
  if(dayNum(key)%3===0)rest.unshift({t:"Lau sàn thật thơm",boss:"dust",r:R(30,1),hp:1});
  rest.forEach(o=>add(load.indexOf(Math.min(...load)),o));
  return q}
const weekOwner=(mondayKey,N)=>((Math.floor(dayNum(mondayKey)/7))%N+N)%N;
const monthOwner=(y,m,N)=>((y*12+m)%N+N)%N;
const api={rng,R,genDay,dayNum,weekOwner,monthOwner};
if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.SCHED=api;
})(typeof self!=='undefined'?self:this);

/* Shining Road — lớp dữ liệu.
   Có FIREBASE_CONFIG: đăng nhập thật, lưu Firestore, đồng bộ realtime giữa các máy, push.
   Không có: chế độ thử, lưu trong trình duyệt. */
(function(){
const CFG=self.FIREBASE_CONFIG||null,VAPID=self.VAPID_KEY||'',SDK='https://www.gstatic.com/firebasejs/10.12.2/';
const MAXP=3,KEEP_DAYS=60;
const USERK={'sr-me':'me','sr2-bag':'bag','sr2-seen':'seen','sr2-stat':'stat','sr2-bclaim':'bclaim','sr2-badges':'badges','sr2-wardrobe':'wardrobe','sr2-eq':'eq','sr2-spent':'spent','sr2-earn':'earn'};
const HOMEK={'sr2-q':'q','sr2-menu':'menu','sr2-dish':'dish','sr-custom':'custom','sr2-buy':'buy'};
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
const toMap=a=>Array.isArray(a)?Object.fromEntries(a.map(c=>[c.id,c])):(a||{});
const DB={mode:CFG?'fb':'local',MAXP,uid:null,email:'',cache:{},home:null,onRemote:null,onToast:null};
self.DB=DB;
let fb=null,auth=null,fs=null,FV=null,FP=null,homeUnsub=null;
const userRef=()=>fs.collection('users').doc(DB.uid);
const homeRef=()=>fs.collection('homes').doc(DB.home.id);

/* ---------- đọc / ghi ---------- */
DB.get=k=>{const v=DB.cache[k];if(v===undefined||v===null)return null;if(k==='sr-custom')return Object.values(v);return clone(v)};
DB.set=(k,v)=>{if(k==='sr-custom')v=toMap(v);const prev=DB.cache[k]||{};DB.cache[k]=clone(v);
  if(DB.mode==='local'){try{localStorage.setItem(k,JSON.stringify(k==='sr-custom'?Object.values(v||{}):v))}catch(e){}return}
  if(USERK[k]){userRef().set({[USERK[k]]:clone(v)},{merge:true}).catch(err);return}
  if(HOMEK[k]&&DB.home){const f=HOMEK[k],args=[];const nv=DB.cache[k]||{};
    new Set([...Object.keys(prev),...Object.keys(nv)]).forEach(id=>{const a=JSON.stringify(prev[id]),b=JSON.stringify(nv[id]);if(a!==b)args.push(new FP(f,id),nv[id]===undefined?FV.delete():nv[id])});
    if(args.length)homeRef().update(...args).catch(err)}};
function err(e){console.error(e);DB.onToast&&DB.onToast('Lỗi lưu dữ liệu: '+(e.code||e.message))}

/* ---------- thành viên ---------- */
DB.members=()=>{if(DB.mode==='local'){let n=(JSON.parse(localStorage.getItem('sr2-home')||'null')||{n:2}).n||2;n=Math.max(1,Math.min(MAXP,n));
    const me=DB.get('sr-me')||{};const mock=[{uid:'p2',name:'Player 2',av:'cat',eq:{head:'beanie'}},{uid:'p3',name:'Player 3',av:'pup',eq:{face:'round'}}];
    const pool=['cat','pup','sheep','pig'].filter(a=>a!==(me.av||'frog'));mock.forEach((m,i)=>m.av=pool[i]);
    return [{uid:'me',name:me.name||'Bạn',av:me.av||'frog',eq:DB.get('sr2-eq')||{}},...mock.slice(0,n-1)]}
  if(!DB.home)return [{uid:DB.uid,name:(DB.get('sr-me')||{}).name||'Bạn',av:(DB.get('sr-me')||{}).av||'frog',eq:DB.get('sr2-eq')||{}}];
  return DB.home.members.map(u=>({uid:u,...(DB.home.info&&DB.home.info[u]||{name:'Thành viên',av:'cat'})}))};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
DB.startKey=uid=>{if(DB.mode==='local'){let s=localStorage.getItem('sr2-start');if(!s){const d=new Date();d.setDate(d.getDate()-3);s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');localStorage.setItem('sr2-start',s)}return s}
  if(!DB.home)return todayKey();const a=DB.home.start||todayKey(),b=(DB.home.info[uid]||{}).since||a;return a>b?a:b};
DB.isOwner=()=>DB.mode==='local'||!DB.home||DB.home.owner===DB.uid;
DB.code=()=>DB.mode==='local'?((DB.get('sr-me')||{}).home||'------'):(DB.home?DB.home.code:'------');
DB.ledger=uid=>((DB.cache.ledger||{})[uid])||{g:0,h:0,e:0};
DB.addLedger=(uid,d)=>{const L=DB.cache.ledger=DB.cache.ledger||{};const o=L[uid]=L[uid]||{g:0,h:0,e:0};['g','h','e'].forEach(c=>o[c]+=(d[c]||0));
  if(DB.mode==='local'){localStorage.setItem('sr2-ledger',JSON.stringify(L));return}
  const args=[];['g','h','e'].forEach(c=>{if(d[c])args.push(new FP('ledger',uid,c),FV.increment(d[c]))});if(args.length)homeRef().update(...args).catch(err)};
DB.setProfile=p=>{const me=Object.assign(DB.get('sr-me')||{},p.name?{name:p.name}:{},p.av?{av:p.av}:{});DB.set('sr-me',me);
  if(DB.mode==='fb'&&DB.home){const eq=p.eq!==undefined?p.eq:(DB.get('sr2-eq')||{});const since=(DB.home.info[DB.uid]||{}).since||todayKey();homeRef().update(new FP('info',DB.uid),clone({name:me.name||'Bạn',av:me.av||'frog',eq,since})).catch(err)}};

/* ---------- nhà ---------- */
const newCode=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
DB.createHome=async()=>{if(DB.mode==='local'){const me=DB.get('sr-me')||{};me.home=newCode();me.owner=true;DB.set('sr-me',me);return me.home}
  let code;for(let i=0;i<5;i++){code=newCode();const c=await fs.collection('codes').doc(code).get();if(!c.exists)break}
  const href=fs.collection('homes').doc(),me=DB.get('sr-me')||{};const b=fs.batch();
  b.set(href,{code,owner:DB.uid,members:[DB.uid],info:{[DB.uid]:{name:me.name||'Bạn',av:me.av||'frog',eq:DB.get('sr2-eq')||{},since:todayKey()}},start:todayKey(),created:FV.serverTimestamp(),q:{},menu:{},dish:{},custom:{},buy:{},ledger:{}});
  b.set(fs.collection('codes').doc(code),{hid:href.id,owner:DB.uid});b.set(userRef(),{homeId:href.id},{merge:true});await b.commit();return code};
DB.joinHome=async code=>{code=(code||'').trim().toUpperCase();
  if(DB.mode==='local'){const me=DB.get('sr-me')||{};me.home=code;me.owner=false;DB.set('sr-me',me);return}
  const c=await fs.collection('codes').doc(code).get();if(!c.exists)throw new Error('Không tìm thấy nhà với mã này');
  const hid=c.data().hid,me=DB.get('sr-me')||{};
  try{await fs.collection('homes').doc(hid).update(new FP('members'),FV.arrayUnion(DB.uid),new FP('info',DB.uid),{name:me.name||'Bạn',av:me.av||'frog',eq:DB.get('sr2-eq')||{},since:todayKey()})}
  catch(e){throw new Error('Nhà đã đủ '+MAXP+' người hoặc mã không đúng')}
  await userRef().set({homeId:hid},{merge:true})};
DB.addMock=()=>{const h=JSON.parse(localStorage.getItem('sr2-home')||'null')||{n:2};h.n=Math.min(MAXP,(h.n||2)+1);localStorage.setItem('sr2-home',JSON.stringify(h))};
DB.removeMember=async uid=>{if(DB.mode==='local'){const h=JSON.parse(localStorage.getItem('sr2-home')||'null')||{n:2};h.n=Math.max(1,(h.n||2)-1);localStorage.setItem('sr2-home',JSON.stringify(h));return}
  await homeRef().update(new FP('members'),FV.arrayRemove(uid),new FP('info',uid),FV.delete())};
DB.logout=async()=>{if(DB.mode==='local'){localStorage.removeItem('sr2-auth');return}await auth.signOut()};

/* ---------- push ---------- */
DB.pushState=()=>{if(DB.mode==='local')return 'local';if(!('Notification' in self)||!('serviceWorker' in navigator))return navigator.standalone===false||/iPhone|iPad/.test(navigator.userAgent)?'install':'unsupported';return Notification.permission};
DB.enablePush=async()=>{if(DB.mode==='local')throw new Error('Chế độ thử chưa có push');
  if(!VAPID)throw new Error('Chưa điền VAPID_KEY trong firebase-config.js');
  const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Bạn chưa cho phép thông báo');
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const token=await fb.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!token)throw new Error('Không lấy được mã thiết bị');
  await userRef().set({tokens:FV.arrayUnion(token)},{merge:true});return token};

/* ---------- khởi động ---------- */
const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Không tải được '+src));document.head.appendChild(s)});
function hydrateUser(u){Object.entries(USERK).forEach(([k,f])=>{if(u[f]!==undefined)DB.cache[k]=u[f]})}
function hydrateHome(h){Object.entries(HOMEK).forEach(([k,f])=>{DB.cache[k]=h[f]||{}});DB.cache.ledger=h.ledger||{};
  DB.home={id:DB.home&&DB.home.id||h.id,code:h.code,owner:h.owner,members:h.members||[],info:h.info||{},start:h.start}}
function prune(){if(!DB.isOwner())return;const cut=new Date();cut.setDate(cut.getDate()-KEEP_DAYS);const ck=cut.toISOString().slice(0,10);
  ['sr2-q','sr2-menu','sr2-buy'].forEach(k=>{const m=DB.cache[k]||{},n={};let ch=false;Object.entries(m).forEach(([id,v])=>{const d=(id.match(/^\d{4}-\d{2}-\d{2}/)||[])[0];if(d&&d<ck)ch=true;else n[id]=v});if(ch)DB.set(k,n)})}
function showLogin(){const o=document.getElementById('onb');o.hidden=false;['s0','s1','s2','s3'].forEach(s=>document.getElementById(s).classList.toggle('on',s==='s0'))}
function loginUI(){const msg=t=>{const h=document.getElementById('loginMsg');h.textContent=t};
  document.getElementById('gLogin').onclick=async()=>{const p=new fb.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await auth.signInWithRedirect(p);else msg('Đăng nhập Google lỗi: '+e.code)}};
  const em=()=>document.getElementById('em').value.trim(),pw=()=>document.getElementById('pw').value;
  document.getElementById('eLogin').onclick=async()=>{try{await auth.signInWithEmailAndPassword(em(),pw())}catch(e){msg(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'?'Sai email hoặc mật khẩu. Chưa có tài khoản thì bấm Tạo tài khoản.':'Lỗi: '+e.code)}};
  document.getElementById('eSignup').onclick=async()=>{if(pw().length<6){msg('Mật khẩu từ 6 ký tự');return}try{await auth.createUserWithEmailAndPassword(em(),pw())}catch(e){msg(e.code==='auth/email-already-in-use'?'Email này đã có tài khoản, bấm Đăng nhập.':'Lỗi: '+e.code)}};
  document.getElementById('loginHint').textContent='Dữ liệu lưu trên Firebase theo tài khoản, đổi máy vẫn còn.'}
DB.boot=async()=>{
  if(DB.mode==='local'){Object.keys({...USERK,...HOMEK}).forEach(k=>{try{const v=JSON.parse(localStorage.getItem(k));if(v!==null)DB.cache[k]=k==='sr-custom'?toMap(v):v}catch(e){}});
    try{DB.cache.ledger=JSON.parse(localStorage.getItem('sr2-ledger'))||{}}catch(e){DB.cache.ledger={}}
    DB.uid='me';self.APP();return}
  for(const f of['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js','firebase-messaging-compat.js'])await load(SDK+f);
  fb=self.firebase;fb.initializeApp(CFG);auth=fb.auth();fs=fb.firestore();FV=fb.firestore.FieldValue;FP=fb.firestore.FieldPath;
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  loginUI();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{fb.messaging().onMessage(p=>{const n=p.notification||{};DB.onToast&&DB.onToast((n.title?n.title+': ':'')+(n.body||''))})}catch(e){}
  auth.onAuthStateChanged(async user=>{
    if(!user){if(DB.started){location.reload();return}showLogin();return}
    if(DB.started)return;DB.uid=user.uid;DB.email=user.email||'';
    const us=await userRef().get();hydrateUser(us.exists?us.data():{});
    const hid=us.exists&&us.data().homeId;
    if(hid){try{const hs=await fs.collection('homes').doc(hid).get();if(hs.exists&&(hs.data().members||[]).includes(DB.uid)){DB.home={id:hid};hydrateHome(hs.data());prune();if(!DB.home.start&&DB.isOwner()){DB.home.start=todayKey();homeRef().update({start:DB.home.start}).catch(()=>{})}}}catch(e){console.warn(e)}}
    DB.started=true;self.APP();
    if(DB.home){const startMembers=JSON.stringify(DB.home.members);
      homeUnsub=homeRef().onSnapshot(s=>{if(s.metadata.hasPendingWrites||!s.exists)return;const h=s.data();
        if(!(h.members||[]).includes(DB.uid)){location.reload();return}
        if(JSON.stringify(h.members)!==startMembers){location.reload();return}
        hydrateHome(h);DB.onRemote&&DB.onRemote()})}
  });
};
})();

  if(d.off===0){d.q.slice(1).flat().forEach(q=>{if(q.i==='shirt'||q.i==='hanger')q.st='claimed'});const s=d.q[0].find(q=>!q.cook&&!q.boss);if(s)s.st='claimed'}});
let saved=store.get('sr2-q')||{};
const STF=['st','sosTo','reqBy','assignee','at','by','pen','penUid','bounty'];
function applyStates(){saved=store.get('sr2-q')||{};all.forEach(q=>{if(!('_mock' in q))q._mock=q.st||null;const s=saved[q.id];
  if(s){STF.forEach(f=>q[f]=s[f]===undefined?null:s[f]);q.dmg=s.dmg||[]}else{STF.forEach(f=>q[f]=null);q.st=q._mock;q.dmg=[]}})}
applyStates();
const save=()=>{const o=Object.assign({},store.get('sr2-q')||{});all.forEach(q=>{if(q.st||q.dmg.length||q.assignee||q.sosTo||q.pen||q.bounty)o[q.id]={t:q.boss&&q.boss.name?q.boss.name+' · '+q.t:q.t,st:q.st||null,dmg:q.dmg,sosTo:q.sosTo||null,reqBy:q.reqBy||null,assignee:q.assignee||null,at:q.at||null,by:q.by||null,pen:q.pen||null,penUid:q.penUid||null,bounty:q.bounty||null};else delete o[q.id]});store.set('sr2-q',o)};
function applyAssign(){days.forEach(d=>{const moves=[];d.q.forEach((l,p)=>l.forEach(q=>{if(q.assignee){const ti=idxOfUid(q.assignee);if(ti>=0&&ti!==p)moves.push([q,p,ti])}}));moves.forEach(([q,p,ti])=>{d.q[p].splice(d.q[p].indexOf(q),1);d.q[ti].push(q)})})}
const ownerOf=q=>q.assignee||q.owner;
applyAssign();
const done=q=>q.st==='claimed';
const bump=(k,n=1)=>{const s=store.get('sr2-stat')||{};s[k]=(s[k]||0)+n;store.set('sr2-stat',s)};
const dayOf=off=>days.find(d=>d.off===off);
const cookQ=d=>d.q.flat().find(q=>q.cook);
function refreshCook(d){const q=cookQ(d),m=menus[d.key];q.r=R(cookReward(m));q.menu=m&&m.main?`${dishName(m.main)}${m.main.id?' '+stars(DISH[m.main.id].d):''} · ${dishName(m.veg)}${m.veg&&m.veg.id?' '+stars(DISH[m.veg.id].d):''}`:'Chưa chốt món'}
days.forEach(refreshCook);


/* ---------- thưởng & bộ đếm ---------- */
function addEarn(r){const e=store.get('sr2-earn')||{g:0,h:0,e:0};e.g+=r.g||0;e.h+=r.h||0;e.e+=r.e||0;store.set('sr2-earn',e)}
function onClaim(q){addEarn(q.r);const s=store.get('sr2-stat')||{},inc=(k,n=1)=>s[k]=(s[k]||0)+n,h=new Date().getHours();
  inc('quests');inc('gold',q.r.g);inc('herb',q.r.h);inc('gem',q.r.e);
  if(q.cook)inc('cook');if(q.boss===DUST)inc('dust');if(q.kind==='wk')inc('wk');if(q.kind==='mo')inc('mo');if(q.custom)inc('custom');
  if(q.i==='broom')inc('sweep');if(q.i==='dish')inc('dish');if(q.i==='shirt'||q.i==='hanger')inc('laundry');if(q.i==='trash')inc('trash');if(q.i==='plates')inc('plates');
  if(h<9)inc('early');if(h>=22)inc('night');
  if(q.reqBy&&q.reqBy!==myUid)inc('helps');
  store.set('sr2-stat',s)}
function dayChecks(){const d=dayOf(0);if(!d)return;const s=store.get('sr2-stat')||{},tk=d.key,yk=keyOf(addD(t0,-1));let ch=false;
  if(d.q[0].length&&d.q[0].every(done)&&s.lastPerfect!==tk){s.perfect=(s.perfect||0)+1;s.lastPerfect=tk;ch=true}
  if(d.q.every(l=>l.every(done))&&s.lastShine!==tk){s.shine=(s.shine||0)+1;s.streak=s.lastShine===yk?(s.streak||0)+1:1;s.best=Math.max(s.best||0,s.streak);s.lastShine=tk;ch=true}
  [0,1].forEach(w=>{const wd=weekDays(w),wk=wd[0].key;if(wd.every(x=>menus[x.key]&&menus[x.key].main)&&!(s.planW||[]).includes(wk)){s.planW=[...(s.planW||[]),wk];ch=true}
    const b=bought[wk],v=b?Object.values(b):[];if(v.length&&v.every(Boolean)&&!(s.mktW||[]).includes(wk)){s.mktW=[...(s.mktW||[]),wk];ch=true}});
  if(ch)store.set('sr2-stat',s)}

/* ---------- phạt & bounty ---------- */
const PEN=.5,BOUNTY_DAYS=2,PEN_LOOK=7;
const penOf=q=>Math.round(q.r.g*PEN);
function markMissed(){days.forEach(d=>d.q.forEach((l,p)=>l.forEach(q=>{q.missed=d.off<0&&!done(q)&&d.key>=DB.startKey(ownerOfDay(q,p))})))}
const ownerOfDay=(q,p)=>q.assignee||P[p].uid;
function pastQuests(key){const d=days.find(x=>x.key===key);if(d)return d.q.map((l,p)=>l.map(q=>({q,uid:ownerOfDay(q,p)})));if(LOCAL)return [];
  const qs=SCHED.genDay(key,N),out=P.map(()=>[]),st=store.get('sr2-q')||{};
  qs.forEach((l,slot)=>l.forEach(o=>{const s=st[o.id]||{},uid=s.assignee||SLOT[slot],p=idxOfUid(uid);if(p<0)return;if(o.cook)o.r=R(cookReward(menus[key]));out[p].push({q:{...o,st:s.st||null},uid})}));
  custom.filter(c=>c.date===key).forEach(c=>{const s=st[c.id]||{},uid=s.assignee||c.uid,p=idxOfUid(uid);if(p>=0)out[p].push({q:{id:c.id,t:c.t,r:DIFF[c.diff].r,st:s.st||null},uid})});
  return out}
function applyPenalties(){let tot=0,cnt=0;const st=Object.assign({},store.get('sr2-q')||{}),myStart=DB.startKey(myUid);let ch=false;
  const mark=(id,t,amt)=>{const s=st[id]||{};st[id]={...s,t:s.t||t,st:s.st||null,pen:amt,penUid:myUid};tot+=amt;cnt++;ch=true};
  for(let o=1;o<=PEN_LOOK;o++){const key=keyOf(addD(t0,-o));if(key<myStart)continue;
    pastQuests(key).forEach(l=>l.forEach(({q,uid})=>{if(uid!==myUid||q.st==='claimed'||(st[q.id]||{}).pen)return;mark(q.id,q.t,penOf(q))}))}
  const pm=new Date(today.getFullYear(),today.getMonth()-1,1);
  [{id:'wk-'+keyOf(addD(mon0,-7)),own:SLOT[SCHED.weekOwner(keyOf(addD(mon0,-7)),N)],g:50,end:keyOf(addD(mon0,-1)),t:'Quái Rêu · Cọ nhà vệ sinh'},
   {id:`mo-${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}`,own:SLOT[SCHED.monthOwner(pm.getFullYear(),pm.getMonth(),N)],g:100,end:keyOf(new Date(today.getFullYear(),today.getMonth(),0)),t:'Rồng Chăn · Chăn ga gối'}]
   .forEach(b=>{const s=st[b.id]||{};if((s.assignee||b.own)!==myUid||s.st==='claimed'||s.pen||b.end<myStart||LOCAL)return;mark(b.id,b.t,Math.round(b.g*PEN))});
  if(ch){store.set('sr2-q',st);DB.addLedger(myUid,{g:-tot});applyStates();setTimeout(()=>say(`Bị trừ ${tot} vàng vì bỏ ${cnt} task`),1400)}}
function bounties(){const L=[];days.filter(d=>d.off<0&&d.off>=-BOUNTY_DAYS).forEach(d=>d.q.forEach((l,p)=>{if(p===0)return;l.forEach(q=>{if(q.missed)L.push({q,d,p})})}));return L}
function bountyBox(){const L=bounties();if(!L.length)return '';
  return `<div class="sec">Bounty</div>${L.map(({q,d,p})=>`<div class="bounty"><div class="si2">${q.boss?px(MON,q.boss.pal):px(ICON[q.i]||ICON.spark)}</div><div class="sb2">${q.boss?q.boss.name+' · ':''}${q.t}<small><b>${P[p].name}</b> bỏ lỡ · ${WD[d.date.getDay()]} ${dm(d.date)}</small>
    <div class="rws"><span class="rw"><img src="${IMG.star}" alt="vàng">${q.r.g} + ${penOf(q)} thưởng phạt</span>${q.r.h?`<span class="rw"><img src="${IMG.clover}" alt="thảo mộc">${q.r.h}</span>`:''}</div></div><button class="btn" data-bounty="${q.id}">Làm thay</button></div>`).join('')}`}
/* ---------- custom tasks ---------- */
const DIFF={easy:{n:'Dễ',r:R(5)},mid:{n:'Vừa',r:R(15)},hard:{n:'Khó',r:R(30,1)},super:{n:'Siêu khó',r:R(50,0,1)}};
let custom=store.get('sr-custom')||[];
const mkQ=c=>({t:c.t,i:c.i,r:DIFF[c.diff].r,id:c.id,custom:true,st:(saved[c.id]||{}).st||null,dmg:[]});
const pOfC=c=>c.uid?idxOfUid(c.uid):(c.p<N?c.p:-1);
function applyCustom(c){const d=days.find(x=>x.key===c.date),p=pOfC(c);if(d&&p>=0&&!all.some(q=>q.id===c.id)){const q=mkQ(c);const s=saved[c.id];if(s)STF.forEach(f=>{if(s[f]!==undefined)q[f]=s[f]});d.q[p].push(q);all.push(q)}}
custom.forEach(applyCustom);applyPenalties();

/* ---------- wallet ---------- */
let spent=store.get('sr2-spent')||{g:0,h:0,e:0};
const BASE=LOCAL?{g:600,h:5,e:1}:{g:0,h:0,e:0};
function wallet(){const br=typeof badgeRewardTotal==='function'?badgeRewardTotal():{g:0,h:0,e:0},ea=store.get('sr2-earn')||{g:0,h:0,e:0},lg=DB.ledger(myUid);
  const sum=c=>BASE[c]+(ea[c]||0)+(lg[c]||0)+br[c]-(spent[c]||0);return{g:sum('g'),h:sum('h'),e:sum('e')}}
function hud(){const w=wallet();$('vG').innerHTML=w.g<0?`0<small class="debt">nợ ${-w.g}</small>`:w.g;$('vH').textContent=w.h;$('vE').textContent=w.e}

/* ---------- map ---------- */
const board=$('board'),map=$('map');let todayY=0;
function weekDays(w){return days.filter(d=>Math.floor(d.i/7)===w)}
function renderBoard(){
  const items=[];[1,0].forEach(w=>{weekDays(w).slice().reverse().forEach(d=>items.push({d}));items.push({mk:w})});
  let y=90,z=0;items.forEach(it=>{if(it.d){it.x=z++%2?110:250}else it.x=180;it.y=y;y+=it.d?170:175});
  const H=y+40;board.style.height=H+'px';
  const pts=[[180,-30],...items.map(it=>[it.x,it.y]),[180,H]];let path=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,d]=pts[i];const my=(b+d)/2;path+=` C${a} ${my},${c} ${my},${c} ${d}`}
  let h=`<svg viewBox="0 0 360 ${H}" style="height:${H}px" aria-hidden="true"><path d="${path}" fill="none" stroke="#2d1b4e" stroke-width="16" stroke-dasharray="14 10"/><path d="${path}" fill="none" stroke="var(--path)" stroke-width="10" stroke-dasharray="14 10"/></svg>`;
  items.forEach(it=>{
    if(it.d){const d=it.d,dt=d.date;const allDone=d.q.every(l=>l.every(done));
      const st=d.off>0?'lock':allDone?'shine':d.off<0?'miss':'';
      if(d.off===0)todayY=it.y;
      h+=`<button class="node ${st} ${d.off===0?'today':''}" style="left:${it.x}px;top:${it.y}px" data-node="${d.key}" aria-label="Ngày ${dm(dt)}"><span class="face"><span class="d">${dt.getDate()}</span><span class="m">${d.off===0?M[dt.getMonth()]:WD[dt.getDay()]}</span></span>${st==='shine'?[[-14,-10],[86,0],[78,82]].map(([l,t],k)=>`<img class="spark" src="${IMG.star}" alt="" style="left:${l}px;top:${t}px;animation-delay:${k*.5}s">`).join(''):''}</button>`;
      const right=it.x>180,lit=!!(menus[d.key]&&menus[d.key].main);
      h+=`<button class="camp ${lit?'':'off'}" style="left:${right?it.x+68:it.x-68}px;top:${it.y+40}px" data-camp="${d.key}" aria-label="Trại nấu ngày ${dm(dt)}${lit?'':', chưa chốt món'}">${px(lit?FIRE:ASH)}</button>`;
      h+=`<div class="info" style="top:${it.y-14*N}px;left:${right?8:192}px">${d.q.map((l,p)=>{const n=l.filter(done).length;return `<div class="row ${right?'rev':''}">${avt(p)}<div class="bar"><i style="width:${l.length?n/l.length*100:0}%"></i></div><b>${n}/${l.length}</b></div>`}).join('')}</div>`;
    }else{const wd=weekDays(it.mk),miss=wd.filter(d=>!(menus[d.key]&&menus[d.key].main)).length;
      h+=`<button class="mkt" style="left:${it.x}px;top:${it.y}px" data-mkt="${it.mk}"><span class="st">${px(STALL)}</span><span class="lb">Chợ tuần ${dm(wd[0].date)}</span>${miss?`<span class="warn">${miss} ngày chưa chốt món</span>`:''}</button>`}
  });
  h+=`<div class="mile" style="top:${H-30}px">Tuần trước · 6/7 ngày sáng</div>`;
  board.innerHTML=h;
}
const Z=()=>parseFloat(getComputedStyle(board).zoom)||1;
map.addEventListener('scroll',()=>{$('homeBtn').classList.toggle('on',Math.abs(map.scrollTop+map.clientHeight/2-todayY*Z())>map.clientHeight*.7)});
$('homeBtn').onclick=()=>map.scrollTo({top:todayY*Z()-map.clientHeight/2,behavior:'smooth'});

/* ---------- quest cards ---------- */
const rws=r=>`<div class="rws"><span class="rw"><img src="${IMG.star}" alt="vàng">${r.g}</span>${r.h?`<span class="rw"><img src="${IMG.clover}" alt="thảo mộc">${r.h}</span>`:''}${r.e?`<span class="rw"><img src="${IMG.gem}" alt="đá quý">${r.e}</span>`:''}</div>`;
let asking=null;
function askBox(q){const tip=Math.ceil(q.r.g*.2);if(N<2)return `<div class="ask">Nhà chỉ có mình bạn, chưa nhờ ai được.<div class="row2"><button class="btn no" data-nosos="1">Đóng</button></div></div>`;return `<div class="ask">Nhờ ai làm thay "${q.t}"? Người nhận hưởng toàn bộ thưởng, bạn trả tip ${tip} vàng.<div class="row2" style="flex-wrap:wrap">${others().map(i=>`<button class="btn" data-sendsos="${q.id}|${i}"><img src="${AV[P[i].av]}" alt="" style="width:18px;height:18px;vertical-align:middle;image-rendering:pixelated"> ${P[i].name}</button>`).join('')}<button class="btn no" data-nosos="1">Thôi</button></div></div>`}
function questCard(q,mode,dkey){
  const lock=mode==='lock',ro=mode!=='live';let act='';
  if(q.st==='claimed')act=`<div class="check">${px(ICON.check)}</div>`;
  else if(!ro&&q.st==='done')act=`<button class="btn claim" data-claim="${q.id}">Claim!</button>`;
  else if(!ro&&q.st==='sos')act=`<button class="sos" data-unsos="${q.id}">Huỷ nhờ</button>`;
  else if(!ro)act=`<button class="btn" data-done="${q.id}">Xong</button><button class="sos" data-sos="${q.id}">Call Support</button>`;
  else if(lock)act=`<div class="check" style="opacity:.6">${px(ICON.lock)}</div>`;
  let meta=q.st==='sos'?`<div class="qm">Đang chờ ${nameOf(q.sosTo)} nhận...</div>`:q.menu?`<div class="qm">${q.menu}</div>`:'';
  if(q.missed)meta+=`<div class="qm miss">Bỏ lỡ · bị trừ ${penOf(q)} vàng</div>`;else if(q.bounty&&q.bounty!==myUid)meta+=`<div class="qm">${nameOf(q.bounty)} đã làm thay</div>`;else if(q.bounty)meta+=`<div class="qm">Bạn làm thay (Bounty)</div>`;
  if(q.cook)meta+=`<button class="sos" data-camp="${dkey}" style="margin-top:3px">Trại nấu</button>`;
  let h=`<div class="q ${q.st==='claimed'?'claimed':''} ${lock?'lock':''} ${q.st==='sos'?'wait':''}"><div class="ico" style="background:${icoBg[q.i]||'#fff'}">${px(ICON[q.i]||ICON.spark)}</div><div class="qb"><div class="qn">${q.t}</div>${meta}${rws(q.r)}</div><div class="acts">${act}</div></div>`;
  if(asking===q.id)h+=askBox(q);return h;
}
function bossCard(q,mode){
  const ro=mode!=='live',lock=mode==='lock';const total=q.steps?q.steps.length:q.hp;
  const left=q.st==='claimed'||q.st==='done'?0:total-q.dmg.length,dead=left===0;let body='',act='';
  if(q.steps&&!ro&&!dead)body=`<div class="steps">${q.steps.map((s,k)=>{const d=q.dmg.includes(k);return `<button class="stp ${d?'done':''}" ${d?'disabled':''} data-step="${q.id}:${k}"><span class="sw">${px(d?ICON.check:ICON.sword)}</span>${s}</button>`}).join('')}</div>`;
  if(q.st==='claimed')act=`<div class="defeated">Defeated!</div>`;
  else if(!ro&&dead)act=`<div class="defeated">Defeated!</div><div style="text-align:center;margin-top:6px"><button class="btn claim big" data-claim="${q.id}">Claim!</button></div>`;
  else if(!ro&&q.st==='sos')act=`<div style="display:flex;justify-content:space-between;align-items:center;position:relative"><span style="font-size:20px">Đang chờ ${nameOf(q.sosTo)} nhận...</span><button class="sos" data-unsos="${q.id}">Huỷ nhờ</button></div>`;
  else if(!ro)act=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative">${q.steps?'<span style="font-size:19px;opacity:.85">Mỗi việc xong là một đòn</span>':`<button class="btn big" data-hit="${q.id}">Đánh!</button>`}<button class="sos" data-sos="${q.id}">Call Support</button></div>`;
  let h=`<div class="boss ${q.kind||''}" id="b-${q.id}"><div class="bt"><div><div class="bn">${q.boss.name}</div><div class="bsub">${q.t}</div></div>${q.due?`<span class="due">${q.due}</span>`:''}</div>
   <div class="arena"><div class="mon ${dead||q.st==='claimed'?'dead':''}" id="m-${q.id}">${px(MON,q.boss.pal)}</div><div class="hpw"><div class="hpl"><span>HP</span><span>${left}/${total}</span></div><div class="hp"><i style="width:${left/total*100}%"></i></div>${rws(q.r)}</div></div>${body}${lock?'':act}</div>`;
  if(asking===q.id)h+=askBox(q);return h;
}
const card=(q,mode,dkey)=>q.boss?bossCard(q,mode):questCard(q,mode,dkey);
function mini(q){return `<div class="mini ${done(q)?'ok':''}">${px(done(q)?ICON.check:(q.boss?ICON.sword:(ICON[q.i]||ICON.spark)))}<span>${q.boss?q.boss.name+' · ':''}${q.t}</span><em>${q.st==='sos'?'nhờ bạn':q.missed?'bỏ lỡ':q.bounty?'bounty':''}</em></div>`}
const otherBlocks=d=>d.q.slice(1).map((l,i)=>otherBlock(l,i+1)).join('');
function otherBlock(list,pi){const n=list.filter(done).length;return `<details class="other"><summary>${avt(pi)}${P[pi].name} <span style="opacity:.7">${n}/${list.length}</span><span class="tg">▶</span></summary>${list.map(mini).join('')}</details>`}
function meCard(list){const n=list.filter(done).length;const earned=list.filter(done).reduce((a,q)=>a+q.r.g,0);
  return `<div class="mecard">${avt(0)}<div class="grow"><div class="nm">${P[0].name}</div><div class="bar"><i style="width:${list.length?n/list.length*100:0}%"></i></div><div class="earn">${n}/${list.length} quest · đã nhận ${earned} vàng</div></div></div>`}
function incoming(){return all.filter(q=>q.st==='sos'&&q.sosTo===myUid)}
function incomingBox(){const L=incoming();if(!L.length)return '';
  return `<div class="sec">Lời nhờ cho bạn</div>${L.map(q=>{const d=days.find(x=>q.id.startsWith(x.key)),tip=Math.ceil(q.r.g*.2);
    return `<div class="sosin"><div class="si2">${q.boss?px(MON,q.boss.pal):px(ICON[q.i]||ICON.spark)}</div><div class="sb2"><b>${nameOf(q.reqBy)}</b> nhờ bạn: ${q.boss?q.boss.name+' · ':''}${q.t}<small>${d?(d.off===0?'Hôm nay':WD[d.date.getDay()]+' '+dm(d.date)):''} · thưởng ${q.r.g} vàng + tip ${tip}</small>
    <div class="row2"><button class="btn" data-accept="${q.id}">Nhận giúp</button><button class="btn no" data-decline="${q.id}">Từ chối</button></div></div></div>`}).join('')}`}
function bossSec(title,list){const mine=list.filter(q=>ownerOf(q)===myUid),theirs=list.filter(q=>ownerOf(q)!==myUid);
  return `<div class="sec">${title}</div>${mine.map(q=>card(q,'live')).join('')}${theirs.map(q=>`<div class="note" style="text-align:left;margin:0 0 8px">${q.boss.name} tuần này thuộc về ${nameOf(ownerOf(q))}${done(q)?' · đã hạ':''}</div>`).join('')}`}
function renderBoss(){const d=dayOf(0),mine=d.q[0];
  $('vBoss').innerHTML=`<div class="qtop"><h1 class="title">Boss</h1><span class="datechip">${d.date.getDate()} ${M[d.date.getMonth()]}</span></div>${meCard(mine)}
   ${incomingBox()}${bountyBox()}

function dishLine(x){if(!x)return '';if(x.other)return `${x.other}<small>Món khác</small>`;const o=DISH[x.id];return `${o.n}<small>Khó ${stars(o.d)} · Lâu ${stars(o.t)}</small>`}

function weekSlots(){const rnd=rng(+keyOf(mon0).replace(/-/g,'')+7);const pick=(arr,n)=>{const a=arr.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(Math.floor(rnd()*a.length),1)[0]);return o};
  const by=k=>POOL.filter(s=>rarOf(s)===k);const rare=rnd()<.2?pick(by('L'),1):pick(by('r'),1);

function pxIn(rows,x,y,w,h){const ih=rows.length,iw=Math.max(...rows.map(r=>r.length));let s=`<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 ${iw} ${ih}" preserveAspectRatio="none" shape-rendering="crispEdges">`;

function placeItem(it,av){const a=ANC[av],o=(OVR[av]&&OVR[av][it.id])||{},ih=it.px.length,iw=Math.max(...it.px.map(r=>r.length)),sc=it.sc*(o.sc||1)*((it.s==='head'?a.hs:a.fs)||1),dx=o.dx||0,dy=o.dy||0;
  if(it.s==='head'){const[cx,top,hw]=a.h,w=hw*sc,h=w*ih/iw;return{x:cx+hw*(it.ox||0)-w/2+dx,y:top-h*(1-it.ov)+dy,w,h}}
  const[cx,ey,fw]=a.f,w=fw*sc,h=w*ih/iw;return{x:cx+fw*(it.ox||0)-w/2+dx,y:ey+fw*(it.dy||0)-h/2+dy,w,h}}
function avatar(av,eq,cls){const[iw,ih]=AVS[av]||[96,96];let x0=0,y0=0,x1=iw,y1=ih,items='';

  return `<svg class="${cls||'av'}" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" role="img" aria-label="${AVN[av]||''}"><image href="${AV[av]}" x="0" y="0" width="${iw}" height="${ih}" preserveAspectRatio="none" style="image-rendering:pixelated"/>${items}</svg>`}

  else if(ds.node){const d=days.find(x=>x.key===ds.node);if(d.off===0)go('vBoss');else{dayKey=d.key;renderDay();go('vDay')}}
  else if(ds.camp){openCook(ds.camp,ds.from||curView)}
  else if(ds.mkt!==undefined){mktWeek=+ds.mkt;renderMarket();go('vMarket')}
  else if(ds.pick){const[k,id]=ds.pick.split(':');if(id==='__other'){otherOpen[k]=true;draft[k]={other:(draft[k]&&draft[k].other)||''}}else{otherOpen[k]=false;draft[k]={id}}keepScroll(renderCook)}
  else if(ds.newdish){openNewDish()}
  else if(ds.chot){const d=days.find(x=>x.key===cookKey);menus[cookKey]=draft;store.set('sr2-menu',menus);refreshCook(d);keepScroll(rerender);say('Đã chốt món: '+menuText(draft))}
  else if(ds.buyck){const[wk,i]=ds.buyck.split('|');bought[wk][i]=!bought[wk][i];store.set('sr2-buy',bought);keepScroll(renderMarket)}
  else if(ds.buy){const s=SLOTS.find(x=>x.id===+ds.buy),w=wallet();if(w.g>=s.p.g&&w.e>=s.p.e){spent.g+=s.p.g;spent.e+=s.p.e;store.set('sr2-spent',spent);bag.push({id:s.id,base:s.id,step:0});bump('buy');bump('spent',s.p.g);seen.add(s.id);saveBag();keepScroll(rerender);say(`Đã mua ${SP[s.id].n}! Xem trong Bag`)}}
  else if(ds.evo!==undefined){openEvo(+ds.evo)}
  else if(ds.evoto){const[i,id]=ds.evoto.split(':').map(Number);evolve(i,id)}
  else if(ds.bagtab){bagTab=ds.bagtab;renderBag()}
  else if(ds.gen){dexGen=+ds.gen;renderBag()}
  else if(ds.v2){go(ds.v2)}
  else if(ds.cal){calSel=parseKey(ds.cal);keepScroll(renderCal)}
  else if(ds.add){openAdd()}
  else if(ds.mpick){openMonthPick()}
  else if(ds.bounty){const q=byId(ds.bounty);if(q&&q.missed){flyStars(t);const bonus=penOf(q);q.st='claimed';q.by=myUid;q.bounty=myUid;q.at=Date.now();onClaim(q);addEarn({g:bonus});bump('bounty');save();setTimeout(()=>keepScroll(rerender),380);say(`Làm thay xong! +${q.r.g+bonus} vàng`)}}
  else if(ds.accept){const q=byId(ds.accept);if(q&&q.st==='sos'&&q.sosTo===myUid){const tip=Math.ceil(q.r.g*.2);q.assignee=myUid;q.st=null;q.sosTo=null;save();DB.addLedger(myUid,{g:tip});if(q.reqBy)DB.addLedger(q.reqBy,{g:-tip});applyAssign();keepScroll(rerender);say(`Đã nhận giúp "${q.t}" · +${tip} vàng tip`)}}
  else if(ds.decline){const q=byId(ds.decline);if(q){q.st=null;q.sosTo=null;save();keepScroll(rerender);say('Đã từ chối lời nhờ')}}
  else if(ds.shoptab){shopTab=ds.shoptab;if(curView!=='vShop')go('vShop');renderShop()}
  else if(ds.wf){wardF=ds.wf;keepScroll(renderShop)}
  else if(ds.buyitem){const it=ITM[ds.buyitem],p=IPRICE[it.rar],w=wallet();if(w.g>=p.g&&w.e>=p.e){spent.g+=p.g;spent.e+=p.e;store.set('sr2-spent',spent);bump('spent',p.g);wardrobe.add(it.id);myEq[it.s]=it.id;saveWard();keepScroll(rerender);say(`Đã mua ${it.n} và mặc luôn`)}}
  else if(ds.getitem){const it=ITM[ds.getitem];if(itemUnlocked(it)){wardrobe.add(it.id);myEq[it.s]=it.id;saveWard();keepScroll(rerender);say(`Đã nhận ${it.n}!`)}}
  else if(ds.equip){const it=ITM[ds.equip];myEq[it.s]=myEq[it.s]===it.id?undefined:it.id;saveWard();keepScroll(rerender)}
  else if(ds.unequip){delete myEq[ds.unequip];saveWard();keepScroll(rerender)}
  else if(ds.bclaim){flyStars(t);claimBadge(ds.bclaim);setTimeout(()=>keepScroll(rerender),380);say('Đã nhận thưởng huy hiệu')}
  else if(ds.bclaimall){flyStars(t);badgeList().filter(pendingRew).forEach(b=>claimBadge(b.id));setTimeout(()=>keepScroll(rerender),380);say('Đã nhận hết thưởng huy hiệu')}
  else if(ds.reonb){closeSheet();pick=null;grid.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed','false'));$('go1').disabled=true;$('nm').value='';$('cd').value='';$('mkOut').hidden=true;show('s1');onb.hidden=false}
  else if(ds.addp){if(N<MAXP){DB.addMock();location.reload()}}
  else if(ds.rmp){if(confirm('Xoá '+nameOf(ds.rmp)+' khỏi nhà?'))DB.removeMember(ds.rmp).then(()=>location.reload()).catch(e=>say(e.message))}
  else if(ds.push){t.disabled=true;DB.enablePush().then(()=>{say('Đã bật thông báo');openProfile()}).catch(e=>{t.disabled=false;say(e.message)})}
  else if(ds.logout){closeSheet();DB.logout().then(()=>location.reload())}
  else if(ds.mto){const[y,m]=ds.mto.split('-').map(Number);calM=new Date(y,m,1);calSel=(y===t0.getFullYear()&&m===t0.getMonth())?t0:calM;closeSheet();renderCal()}
  else if(ds.del){const id=ds.del;custom=custom.filter(c=>c.id!==id);store.set('sr-custom',custom);days.forEach(d=>d.q.forEach(l=>{const i=l.findIndex(q=>q.id===id);if(i>-1)l.splice(i,1)}));const j=all.findIndex(q=>q.id===id);if(j>-1)all.splice(j,1);keepScroll(rerender);say('Đã xoá task')}
});

/* ---------- onboarding ---------- */
const onb=$('onb'),grid=$('grid');let pick=null,createdCode=null;
Object.keys(AV).forEach(k=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',AVN[k]);b.innerHTML=`<img src="${AV[k]}" alt="">`;
  b.onclick=()=>{grid.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');pick=k;$('go1').disabled=false};grid.appendChild(b)});
const show=n=>['s0','s1','s2','s3'].forEach(s=>$(s).classList.toggle('on',s===n));
const hasHome=()=>LOCAL?!!(me&&me.home):!!DB.home;
$('go1').onclick=()=>{$('heroImg').src=AV[pick];show('s2');$('nm').focus()};
$('nm').oninput=()=>$('go2').disabled=!$('nm').value.trim();$('nm').onkeydown=e=>{if(e.key==='Enter'&&$('nm').value.trim())$('go2').click()};
$('go2').onclick=()=>{me=Object.assign(me||{},{av:pick,name:$('nm').value.trim()});DB.setProfile({name:me.name,av:me.av});
  if(hasHome()){location.reload();return}
  $('heroImg2').src=AV[pick];$('hiName').textContent='Hi '+me.name+'! Your home?';show('s3')};
$('cd').oninput=()=>$('go3').disabled=$('cd').value.trim().length<6;
$('mk').onclick=async()=>{$('mk').disabled=true;try{const c=await DB.createHome();createdCode=c;$('codeOut').textContent=c;$('mkOut').hidden=false;$('cd').value=c;$('go3').disabled=false;$('go3').textContent='Vào nhà của mình'}catch(e){say(e.message);$('mk').disabled=false}};
$('go3').onclick=async()=>{const code=$('cd').value.trim().toUpperCase();$('go3').disabled=true;
  try{if(code!==createdCode)await DB.joinHome(code);location.reload()}catch(e){say(e.message);$('go3').disabled=false}};
function enter(){$('me').innerHTML=avt(0);onb.hidden=true;rerender();go('vMap')}
$('me').onclick=openProfile;
function afterLogin(){if(me&&AV[me.av]&&hasHome())enter();else if(me&&AV[me.av]){$('heroImg2').src=AV[me.av];$('hiName').textContent='Hi '+me.name+'! Your home?';show('s3');onb.hidden=false}else{show('s1');onb.hidden=false}}
if(LOCAL){const doLogin=email=>{localStorage.setItem('sr2-auth',JSON.stringify({email,at:Date.now()}));afterLogin()};
  $('gLogin').onclick=()=>doLogin('');
  $('eLogin').onclick=()=>{const e=$('em').value.trim();if(!/.+@.+\..+/.test(e)){say('Nhập email hợp lệ');return}if($('pw').value.length<6){say('Mật khẩu từ 6 ký tự');return}doLogin(e)};
  $('eSignup').onclick=$('eLogin').onclick;
  if(localStorage.getItem('sr2-auth'))afterLogin();else{show('s0');onb.hidden=false}}
else afterLogin();

/* ---------- đồng bộ từ máy khác ---------- */
DB.onToast=say;
DB.onRemote=()=>{menus=Object.assign({},store.get('sr2-menu')||{});Object.assign(DISH,store.get('sr2-dish')||{});
  const nb=store.get('sr2-buy')||{};Object.keys(bought).forEach(k=>delete bought[k]);Object.assign(bought,nb);
  custom=store.get('sr-custom')||[];const ids=new Set(custom.map(c=>c.id));
  days.forEach(d=>d.q.forEach(l=>{for(let i=l.length-1;i>=0;i--)if(l[i].custom&&!ids.has(l[i].id)){const j=all.indexOf(l[i]);if(j>-1)all.splice(j,1);l.splice(i,1)}}));
  custom.forEach(applyCustom);applyStates();applyAssign();days.forEach(refreshCook);
  const m=DB.members();m.forEach(x=>{const i=idxOfUid(x.uid);if(i>0)Object.assign(P[i],{name:x.name,av:x.av,eq:x.eq})});
  if(me)keepScroll(rerender)};

self.sprFail=sprFail;
};

DB.boot().catch(function(e){console.error(e);var t=document.getElementById('toast');t.textContent='Không khởi động được: '+e.message;t.style.display='block'});
</script>
</body>
</html>
